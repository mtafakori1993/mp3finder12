<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Discovery</title>
<style>
  :root {
    --bg: #0f1115;
    --bg-elevated: #171a21;
    --border: #262b36;
    --text: #f4f5f7;
    --text-muted: #9ba3b4;
    --accent: #7c6bf2;
    --accent-hover: #6a58e8;
    --success: #3fd08c;
    --danger: #f2555a;
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 20% -10%, #1c1f2b 0%, var(--bg) 55%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  .page {
    max-width: 880px;
    margin: 0 auto;
    padding: 56px 20px 80px;
  }

  header {
    text-align: center;
    margin-bottom: 40px;
  }

  header h1 {
    font-size: 2.4rem;
    margin: 0 0 8px;
    background: linear-gradient(90deg, #a58bff, #7c6bf2 60%, #5ee7c8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  header p {
    margin: 0;
    color: var(--text-muted);
    font-size: 1.05rem;
  }

  .search-box {
    display: flex;
    gap: 10px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px;
  }

  .search-box input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 1.05rem;
    padding: 14px 16px;
    min-width: 0;
  }

  .search-box input::placeholder {
    color: var(--text-muted);
  }

  .search-box button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 0 26px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, opacity 0.15s ease;
    white-space: nowrap;
  }

  .search-box button:hover:not(:disabled) {
    background: var(--accent-hover);
  }

  .search-box button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .status {
    margin-top: 28px;
    text-align: center;
    color: var(--text-muted);
    font-size: 0.98rem;
    min-height: 24px;
  }

  .status.error {
    color: var(--danger);
  }

  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    margin-right: 8px;
    vertical-align: -2px;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .results {
    margin-top: 32px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 22px;
  }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    flex-wrap: wrap;
  }

  .card-title {
    font-size: 1.15rem;
    font-weight: 600;
    margin: 0 0 4px;
  }

  .card-artist {
    color: var(--text-muted);
    margin: 0 0 8px;
    font-size: 0.95rem;
  }

  .badges {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }

  .badge {
    font-size: 0.78rem;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--text-muted);
    white-space: nowrap;
  }

  .badge.confidence {
    color: var(--success);
    border-color: rgba(63, 208, 140, 0.35);
    background: rgba(63, 208, 140, 0.08);
  }

  .badge.playable {
    color: var(--success);
  }

  .badge.not-playable {
    color: var(--danger);
  }

  .player-row {
    margin-top: 14px;
  }

  audio {
    width: 100%;
    height: 40px;
  }

  .card-links {
    margin-top: 10px;
    font-size: 0.9rem;
  }

  .card-links a {
    color: var(--accent);
    text-decoration: none;
  }

  .card-links a:hover {
    text-decoration: underline;
  }

  .empty-state {
    text-align: center;
    color: var(--text-muted);
    margin-top: 48px;
    line-height: 1.6;
  }

  @media (max-width: 520px) {
    .search-box { flex-direction: column; }
    .search-box button { padding: 14px; }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>Music Discovery</h1>
    <p>Find and play music from the web</p>
  </header>

  <div class="search-box">
    <input
      id="query-input"
      type="text"
      placeholder="Search song, artist, or lyrics..."
      autocomplete="off"
      autofocus
    >
    <button id="search-button">Search</button>
  </div>

  <div id="status" class="status"></div>
  <div id="results" class="results"></div>
</div>

<script>
(function () {
  const queryInput = document.getElementById("query-input");
  const searchButton = document.getElementById("search-button");
  const statusEl = document.getElementById("status");
  const resultsEl = document.getElementById("results");

  const LOADING_MESSAGES = [
    "Searching the web...",
    "Finding candidate tracks...",
    "Validating audio streams...",
  ];

  let loadingInterval = null;

  function startLoadingMessages() {
    let index = 0;
    setStatus(LOADING_MESSAGES[index], "loading");
    loadingInterval = setInterval(() => {
      index = (index + 1) % LOADING_MESSAGES.length;
      setStatus(LOADING_MESSAGES[index], "loading");
    }, 1600);
  }

  function stopLoadingMessages() {
    if (loadingInterval) {
      clearInterval(loadingInterval);
      loadingInterval = null;
    }
  }

  function setStatus(message, kind) {
    statusEl.textContent = "";
    statusEl.className = "status" + (kind === "error" ? " error" : "");
    if (!message) return;
    if (kind === "loading") {
      const spinner = document.createElement("span");
      spinner.className = "spinner";
      statusEl.appendChild(spinner);
      statusEl.appendChild(document.createTextNode(message));
    } else {
      statusEl.textContent = message;
    }
  }

  function clearResults() {
    resultsEl.innerHTML = "";
  }

  function escapeHtml(value) {
    const div = document.createElement("div");
    div.textContent = value == null ? "" : String(value);
    return div.innerHTML;
  }

  function getDomain(url) {
    try {
      return new URL(url).hostname.replace(/^www\./, "");
    } catch (e) {
      return url;
    }
  }

  function renderResults(results) {
    clearResults();

    if (!results || results.length === 0) {
      resultsEl.innerHTML =
        '<div class="empty-state">No playable streams were found for this query.<br>Try a more specific song title, the artist name, or a distinctive lyric line.</div>';
      return;
    }

    results.forEach((track) => {
      const card = document.createElement("div");
      card.className = "card";

      const confidencePct = Math.round((track.confidence || 0) * 100);
      const playable = !!(track.validation && track.validation.playable);
      const domain = getDomain(track.source_page);

      card.innerHTML = `
        <div class="card-top">
          <div>
            <p class="card-title">${escapeHtml(track.title || "Unknown title")}</p>
            ${track.artist ? `<p class="card-artist">${escapeHtml(track.artist)}</p>` : ""}
          </div>
          <div class="badges">
            <span class="badge confidence">${confidencePct}% match</span>
            <span class="badge ${playable ? "playable" : "not-playable"}">${playable ? "Playable" : "Not playable"}</span>
            ${track.mime_type ? `<span class="badge">${escapeHtml(track.mime_type)}</span>` : ""}
            <span class="badge">${escapeHtml(domain)}</span>
          </div>
        </div>
        ${
          playable
            ? `<div class="player-row">
                <audio controls preload="none">
                  <source src="${escapeHtml(track.audio_url)}" ${track.mime_type ? `type="${escapeHtml(track.mime_type)}"` : ""}>
                  Your browser does not support the audio element.
                </audio>
              </div>`
            : ""
        }
        <div class="card-links">
          <a href="${escapeHtml(track.source_page)}" target="_blank" rel="noopener noreferrer">Open source page</a>
        </div>
      `;

      resultsEl.appendChild(card);
    });
  }

  async function runSearch() {
    const query = queryInput.value.trim();
    if (!query) {
      setStatus("Please enter a song name, artist, or lyric fragment.", "error");
      return;
    }

    searchButton.disabled = true;
    clearResults();
    startLoadingMessages();

    try {
      const response = await fetch("/api/search", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query: query }),
      });

      let payload = null;
      try {
        payload = await response.json();
      } catch (parseError) {
        throw new Error("The server returned an invalid response.");
      }

      if (!response.ok) {
        const detail = payload && payload.detail ? payload.detail : "Search failed.";
        throw new Error(detail);
      }

      stopLoadingMessages();
      setStatus("", null);
      renderResults(payload.results);
    } catch (error) {
      stopLoadingMessages();
      setStatus(error.message || "Network error. Please try again.", "error");
    } finally {
      searchButton.disabled = false;
    }
  }

  searchButton.addEventListener("click", runSearch);
  queryInput.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      runSearch();
    }
  });
})();
</script>
</body>
</html>
